<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 상세 팝업</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        /* Popup Container */
        .popup-wrap {
            width: 65%;
            max-width: 860px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.07);
            background: #fff;
            position: relative;
        }

        /* Upper Hero Image Section */
        .popup-hero {
            position: relative;
            width: 100%;
            height: 360px;
        }

        .popup-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            display: block;
        }

        /* HD Badge top-left */
        .popup-hd {
            position: absolute;
            top: 20px;
            left: 20px;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            color: white;
            padding: 3px 10px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 3px;
            letter-spacing: 1px;
            z-index: 5;
        }

        /* Close button top-right */
        .popup-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.45);
            border: none;
            color: white;
            font-size: 20px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 5;
            transition: background 0.2s;
        }

        .popup-close:hover {
            background: rgba(0, 0, 0, 0.75);
        }

        /* Gradient overlay at bottom of hero */
        .popup-hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 80px 30px 28px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.88) 0%, transparent 100%);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
        }

        /* Movie title overlaid on image */
        .popup-hero-title {
            font-size: 28px;
            font-weight: 700;
            color: white;
            text-shadow: 1px 2px 6px rgba(0, 0, 0, 0.8);
            line-height: 1.25;
        }

        /* Play button overlaid on hero */
        .popup-play-btn {
            background: white;
            color: #111;
            border: none;
            padding: 10px 26px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .popup-play-btn:hover {
            background: #ddd;
        }

        /* Lower White Body Section */
        .popup-body {
            padding: 28px 30px 36px;
            background: white;
        }

        .popup-meta {
            font-size: 16px;
            color: #444;
            margin-bottom: 28px;
        }

        /* Episode Section */

        .episodes-title {
            font-size: 18px;
            font-weight: 700;
            color: #111;
            margin-bottom: 18px;
        }

        .episode-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .episode-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }

        .episode-item:last-child {
            border-bottom: none;
        }

        .ep-name {
            font-size: 15px;
            color: #111;
        }

        .ep-play-btn {
            background: #111;
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .ep-play-btn:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <div class="popup-wrap">
        <!-- Hero Image Top -->
        <div class="popup-hero">
            <div class="popup-hd">HD</div>
            <button class="popup-close"><i class="fa-solid fa-xmark"></i></button>
            <img src="https://img.bigfile.pe.kr//conts_images2/20260128/202601282205180_48261.jpg" alt="">
            <div class="popup-hero-overlay">
                <div class="popup-hero-title">[최신 영화] 다윗 DAVID.2025 자체자막</div>
                <button class="popup-play-btn"><i class="fa-solid fa-play"></i> 재생</button>
            </div>
        </div>

        <!-- White Body Bottom -->
        <div class="popup-body">
            <div class="popup-meta">영화 | 최신 / 미개봉</div>

            <div class="popup-episodes">
                <h3 class="episodes-title">에피소드 보기</h3>
                <ul class="episode-list">
                    <li class="episode-item">
                        <span class="ep-name">프로보노.E05.251227.720p.WANNA.mp4</span>
                        <button class="ep-play-btn"><i class="fa-solid fa-play"></i> 재생</button>
                    </li>
                    <li class="episode-item">
                        <span class="ep-name">프로보노.E05.251227.720p.WANNA.mp4</span>
                        <button class="ep-play-btn"><i class="fa-solid fa-play"></i> 재생</button>
                    </li>
                    <li class="episode-item">
                        <span class="ep-name">프로보노.E05.251227.720p.WANNA.mp4</span>
                        <button class="ep-play-btn"><i class="fa-solid fa-play"></i> 재생</button>
                    </li>
                </ul>
            </div>
        </div>
    </div>

</body>

</html>
