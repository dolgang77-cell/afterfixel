<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigTV</title>
    <script>history.scrollRestoration = "manual"; window.scrollTo(0, 0);</script>
    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header" id="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-text green"><img src="images/nlogo_bigfile.png" class="logo-img-main"></span>
            </div>
            <nav class="nav-menu">
                <button class="icon-btn search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                <a href="index.html">홈</a>
                <a href="movie.html#header">영화</a>
                <a href="drama.html#header">드라마</a>
                <a href="cert.html#header" class="badge-item active">성인 <img src="images/mn_19_ico.png"
                        class="badge-19-img"></a>
            </nav>
        </div>
    </header>

    <main class="main-padded">

        <!-- Content Row 2: 최신 성인 인기 콘텐츠 -->
        <section class="slider-section">
            <h2 class="section-title">최신 성인 인기 콘텐츠<img src="images/mn_19_ico.png" class="badge-19-title"

            <div class="slider-wrapper">
                <div class="slider shuffle-slider" id="movie-slider">

                    <div class="card movie-card active" tabindex="0" data-title="" data-meta="성인 | 일반"
                        data-desc="[ 중 - ㄴ ] 데물 트젠한테 잘못걸린 으I사님">
                        <img src="https://img.bigfile.pe.kr//conts_images2/20260303/202603031630330_38621.png" alt="">


                    </div>
                    <div class="card movie-card" tabindex="0" data-title="" data-meta="성인 | 일반"
                        data-desc="[ 중 - ㄴ ] 친형은 이런 형슈랑 어떻게 결혼까지 햇을까 아쉽다">
                        <img src="https://img.bigfile.pe.kr//conts_images2/20260303/202603031630430_66389.gif" alt="">


                    </div>
                    <div class="card movie-card" tabindex="0" data-title="" data-meta="성인 | 일반"
                        data-desc="[ㄴ맑] 다I륙 술먹은날엔 연락 안되는 캐존예">
                        <img src="https://img.bigfile.pe.kr//conts_images2/20260303/202603031630460_92989.png" alt="">


                    </div>
                    <div class="card movie-card" tabindex="0" data-title="" data-meta="성인 | 일반"
                        data-desc="[ 중 - ㄴ ] 커풀 맛사지 해주다가.. 벅고 사빕 해버리네">
                        <img src="https://img.bigfile.pe.kr//conts_images2/20260303/202603031645320_91817.jpg" alt="">


                    </div>
                    <div class="card movie-card" tabindex="0" data-title="" data-meta="성인 | 일반"
                        data-desc="-갓갓-[일- 노] 하루종일 가둬두고 돌림ㅃ 결국 눈물이 터젓네 저l거">
                        <img src="https://img.bigfile.pe.kr//conts_images2/20260303/202603031556560_98634.gif" alt="">


                    </div>
                </div>
            </div>
            <!-- Expanded Details below Active item -->
            <div class="expanded-details active-details">
                <div class="details-content" id="movie-details">
                    <p class="meta">성인 | 일반</p>
                    <p class="desc">[뽄좌][일맑] 물 많고 엄청나게 촉촉한 봉지네 다음에도 생각날듯</p>
                </div>
            </div>
        </section>

        <!-- Content Row 3: 성인 콘텐츠 -->
        <section class="slider-section">
            <h2 class="section-title">성인 콘텐츠<img src="images/mn_19_ico.png" class="badge-19-title"
                    style="margin-left: 8px; vertical-align: sub; width: 54px;"></h2>
            <div class="slider-wrapper">
                <div class="slider shuffle-slider" id="movie-slider">
                    <!-- Movie 1 Active -->
                    <div class="card movie-card active" tabindex="0" data-title="" data-meta="성인 | 일반"

                    <div class="card movie-card" tabindex="0" data-title="" data-meta="성인 | 일반"

                    </div>
                    <div class="card movie-card" tabindex="0" data-title="" data-meta="성인 | 일반"
                        data-desc="사내호식예상치 못한 여상사들의 이벤트에미소노오r카 다나카네네 요시네유리아">

                    </div>
                    <div class="card movie-card" tabindex="0" data-title="" data-meta="성인 | 일반"
                        data-desc="(일제거) 다양한 것들을 가르쳐 주세요 카와이 토키 아오 SOD 독점 AV 데뷔">
                        <img src="https://img.bigfile.pe.kr//conts_images2/20260303/202603031652500_43338.jpg" alt="">


                    </div>
                    <div class="card movie-card" tabindex="0" data-title="" data-meta="성인 | 일반"
                        data-desc="새움마가 주시는- 졸업 최고선물= 야세 마이코">
                        <img src="https://img.bigfile.pe.kr//conts_images2/20260303/202603031605200_17388.jpg" alt="">


                    </div>
                </div>
            </div>
            <!-- Expanded Details below Active item -->
            <div class="expanded-details active-details">
                <div class="details-content" id="movie-details">
                    <p class="meta">드라마 | 중국드라마, 범죄 | 112분 | 12세 이상</p>
                    <p class="desc">나쁜 놈 잡는 데는 수단, 방법, 물불 안 가린다! 짜릿하고 통쾌한 중국드라마 수사극.강력반 형사들의 범죄 소탕 극락 중국드라마.</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer-spacer"></footer>

    <script src="app.js"></script>

</html>
