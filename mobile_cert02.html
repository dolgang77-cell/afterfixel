<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIGTV 성인인증 입력</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="mc-body">
    <div class="mc-container mc-scrollable">
        <div class="mc-bg-overlay blur-bg"></div>

        <form>
            <div class="mc-form-wrapper">
                <!-- Inputs Section -->
                <div class="mc-input-section">
                    <div class="mc-input-group">
                        <label class="mc-label">이름</label>
                        <input type="text" class="mc-input">
                    </div>

                    <div class="mc-input-group">
                        <label class="mc-label">비밀번호</label>
                        <input type="password" class="mc-input">
                    </div>

                    <div class="mc-input-group">
                        <label class="mc-label">비밀번호 확인</label>
                        <input type="password" class="mc-input">
                    </div>

                    <div class="mc-input-group">
                        <label class="mc-label">이메일입력</label>
                        <input type="email" class="mc-input">
                    </div>
                </div>

                <!-- Spacer to push terms down if needed, or just let natural flow -->
                <div class="mc-spacer"></div>

                <!-- Terms Section -->
                <div class="mc-terms-section">
                    <label class="mc-checkbox-row mc-check-all">
                        <input type="checkbox" class="mc-checkbox-input" id="checkAll">
                        <span class="mc-checkbox-box"></span>
                        <span class="mc-checkbox-text">모두동의</span>
                    </label>

                    <label class="mc-checkbox-row">
                        <input type="checkbox" class="mc-checkbox-input mc-chk-item">
                        <span class="mc-checkbox-box"></span>
                        <span class="mc-checkbox-text">[필수]14세 이상입니다.</span>
                    </label>

                    <label class="mc-checkbox-row">
                        <input type="checkbox" class="mc-checkbox-input mc-chk-item">
                        <span class="mc-checkbox-box"></span>
                        <span class="mc-checkbox-text">빅파일이용약관</span>
                    </label>

                    <div class="mc-checkbox-row with-arrow">
                        <label class="mc-flex-label">
                            <input type="checkbox" class="mc-checkbox-input mc-chk-item">
                            <span class="mc-checkbox-box"></span>
                            <span class="mc-checkbox-text">개인정보 수집및 이용 동의</span>
                        </label>
                        <div class="mc-arrow-wrapper">
                            <img class="mc-arrow-img" src="images/cert_arr_ico.png" alt="열기">
                        </div>
                    </div>

                    <div class="mc-checkbox-row with-arrow">
                        <label class="mc-flex-label">
                            <input type="checkbox" class="mc-checkbox-input mc-chk-item">
                            <span class="mc-checkbox-box"></span>
                            <span class="mc-checkbox-text">알림톡, 이메일, 문자 수신 동의</span>
                        </label>
                        <div class="mc-arrow-wrapper">
                            <img class="mc-arrow-img" src="images/cert_arr_ico.png" alt="열기">
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="mc-submit-area">
                    <a href="mobile_cert03.html" class="mc-btn mc-btn-submit">성인 인증 요청</a>
                </div>
            </div>
        </form>
    </div>

    <script>
        // Simple script for handling the check-all behavior
        const checkAll = document.getElementById('checkAll');
        const items = document.querySelectorAll('.mc-chk-item');

        checkAll.addEventListener('change', (e) => {
            items.forEach(item => item.checked = e.target.checked);
        });

        items.forEach(item => {
            item.addEventListener('change', () => {
                const allChecked = Array.from(items).every(i => i.checked);
                checkAll.checked = allChecked;
            });
        });
    </script>
</body>

</html>
