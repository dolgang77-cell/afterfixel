<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성인 인증 팝업</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <style>
        /* Base Reset */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #111;
            /* Dark background to simulate the page behind the popup */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Popup Overlay/Background */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        /* Popup Container */
        .cert-popup {
            background-color: #ffffff;
            width: 600px;
            padding: 50px 40px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            /* Optional: subtle border radius if preferred, but image looks quite square */
            /* border-radius: 8px; */
        }

        /* Titles */
        .cert-popup h2 {
            font-size: 28px;
            font-weight: 700;
            color: #000;
            margin: 0 0 15px 0;
            letter-spacing: -1px;
        }

        .cert-popup p {
            font-size: 16px;
            color: #333;
            margin: 0 0 40px 0;
            line-height: 1.5;
            font-weight: 400;
        }

        /* Pin Input Area */
        .pin-input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .pin-input {
            width: 65px;
            height: 80px;
            background-color: #000;
            border: none;
            color: #fff;
            font-size: 48px;
            font-weight: 700;
            text-align: center;
            font-family: inherit;
        }

        /* Remove arrows from number input */
        .pin-input::-webkit-outer-spin-button,
        .pin-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .pin-input[type=number] {
            -moz-appearance: textfield;
        }

        .pin-input:focus {
            outline: 2px solid #03cf5d;
            /* Assuming standard active color */
        }

        /* Action Buttons */
        .popup-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn-popup {
            width: 120px;
            height: 45px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s;
        }

        /* Complete Button */
        .btn-complete {
            background-color: #000;
            color: #fff;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .btn-complete:hover {
            background-color: #222;
        }

        /* Close Button */
        .btn-close {
            background-color: #fff;
            color: #000;
            border: 1px solid #ccc;
        }

        .btn-close:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>

<body>

    <!-- This overlay would normally be hidden and toggled via JS -->
    <div class="popup-overlay">
        <div class="cert-popup">
            <h2>성인 인증이 필요한 콘텐츠입니다</h2>
            <p>본 콘텐츠는 만 19세 이상만 이용할 수 있습니다.<br>비밀번호를 입력해주세요.</p>

            <div class="pin-input-group">
                <!-- Maxlength doesn't work well on number inputs, using text and JS logic or just text with 1 char limit -->
                <input type="text" class="pin-input" maxlength="1" value="8" autocomplete="off">
                <input type="text" class="pin-input" maxlength="1" value="6" autocomplete="off">
                <input type="text" class="pin-input" maxlength="1" value="4" autocomplete="off">
                <input type="text" class="pin-input" maxlength="1" value="1" autocomplete="off">
            </div>

            <div class="popup-actions">
                <button type="button" class="btn-popup btn-complete">완료</button>
                <button type="button" class="btn-popup btn-close">닫기</button>
            </div>
        </div>
    </div>

    <!-- Script to handle auto-focus and TV arrow key navigation -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pinInputs = Array.from(document.querySelectorAll('.pin-input'));
            const completeBtn = document.querySelector('.btn-complete');
            const closeBtn = document.querySelector('.btn-close');
            const actionBtns = [completeBtn, closeBtn];

            // All focusable elements in logical visual order
            const focusables = [...pinInputs, ...actionBtns];

            // Initial focus
            pinInputs[0].focus();

            // Handling Input Events
            pinInputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Only allow numbers
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');

                    // Auto advance to next input if there's a character
                    if (e.target.value !== '' && index < pinInputs.length - 1) {
                        pinInputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    // Handle backspace navigation backward
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        pinInputs[index - 1].focus();
                        pinInputs[index - 1].value = ''; // Clear previous input
                    }
                });
            });

            // Handling Arrow Navigation Across the Entire Document
            document.addEventListener('keydown', (e) => {
                const currentFocus = document.activeElement;
                const isInput = pinInputs.includes(currentFocus);
                const isBtn = actionBtns.includes(currentFocus);

                if (!isInput && !isBtn) return; // Not focusing on our elements

                const currentIndex = focusables.indexOf(currentFocus);

                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (currentIndex < focusables.length - 1) {
                        focusables[currentIndex + 1].focus();
                    } else {
                        // Loop back to start
                        focusables[0].focus();
                    }
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (currentIndex > 0) {
                        focusables[currentIndex - 1].focus();
                    } else {
                        // Loop to end
                        focusables[focusables.length - 1].focus();
                    }
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (isInput) {
                        // Move from any input down to the 'Complete' button
                        completeBtn.focus();
                    }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (isBtn) {
                        // Move from any button back up to the first input parameter
                        pinInputs[0].focus();
                    }
                }
            });
        });
    </script>
</body>

</html>
