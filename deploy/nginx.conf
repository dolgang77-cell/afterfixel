# /etc/nginx/sites-available/nightlife
# 심볼릭 링크: ln -s /etc/nginx/sites-available/nightlife /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name nightlife.ive.co.kr;

    # HTTPS 리다이렉트 (SSL 적용 후 활성화)
    # return 301 https://$host$request_uri;

    root /var/www/nightlife/public;
    index index.php;

    charset utf-8;

    # ── 로그 ──
    access_log /var/log/nginx/nightlife-access.log;
    error_log  /var/log/nginx/nightlife-error.log;

    # ── 보안 헤더 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 정적 파일 캐시 ──
    location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Service Worker (캐시하면 안 됨) ──
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ── manifest.json ──
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Storage 심볼릭 링크 (업로드 이미지) ──
    location /storage {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── PHP 요청 ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-nightlife.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 60s;
    }

    # ── 숨김 파일 차단 ──
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── 업로드 크기 ──
    client_max_body_size 10M;

    # ── gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;
}

# ── HTTPS 설정 (certbot 설치 후 자동 생성 또는 아래 수동 설정) ──
