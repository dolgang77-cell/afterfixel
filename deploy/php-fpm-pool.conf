; /etc/php/8.3/fpm/pool.d/nightlife.conf
; PHP-FPM 전용 풀 설정

[nightlife]
user = www-data
group = www-data

; 소켓 방식 (nginx fastcgi_pass와 일치)
listen = /run/php/php8.3-fpm-nightlife.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ── 프로세스 관리 ──
pm = dynamic
pm.max_children = 20          ; 동시 최대 프로세스 (메모리 기준: 1GB → 20, 2GB → 40)
pm.start_servers = 4          ; 시작 시 프로세스
pm.min_spare_servers = 2      ; 최소 대기 프로세스
pm.max_spare_servers = 8      ; 최대 대기 프로세스
pm.max_requests = 500         ; 메모리 누수 방지: 500 요청마다 재시작

; ── 타임아웃 ──
request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm/nightlife-slow.log

; ── 로그 ──
php_admin_value[error_log] = /var/log/php-fpm/nightlife-error.log
php_admin_flag[log_errors] = on

; ── PHP 설정 오버라이드 ──
php_value[upload_max_filesize] = 10M
php_value[post_max_size] = 12M
php_value[max_execution_time] = 60
php_value[memory_limit] = 256M
php_value[session.gc_maxlifetime] = 7200
php_value[opcache.enable] = 1
php_value[opcache.memory_consumption] = 128
php_value[opcache.max_accelerated_files] = 10000
php_value[opcache.validate_timestamps] = 0
; opcache.validate_timestamps=0 → 코드 변경 시 php-fpm restart 필요
